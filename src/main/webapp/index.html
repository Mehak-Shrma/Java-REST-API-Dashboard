
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DATA Management Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>REST API</h2>

        <nav>
            <a href="#" class="active">Dashboard</a>
            <a href="#add-record">Add Record</a>
            <a href="#records">View Records</a>
        </nav>

    </aside>


    <!-- Main Content -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h1>Dashboard</h1>
                <p>Manage your database records</p>
            </div>

            <span class="admin">Admin</span>
        </header>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <h3>Total Records</h3>
                <h2 id="totalRecords">0</h2>
            </div>

            <div class="stat-card">
                <h3>API Status</h3>
                <h2 id="apiStatus">Checking...</h2>
            </div>

        </section>


        <!-- Add Record Form -->
        <section class="panel" id="add-record">

            <h2>Add New Record</h2>

            <form id="dataForm">

                <div class="form-group">
                    <label>ID</label>
                    <input type="number" id="id"
                           placeholder="Enter ID" required>
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="name"
                           placeholder="Enter Name" required>
                </div>

                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="age"
                           placeholder="Enter Age" required>
                </div>

                <div class="form-group">
                    <label>Address</label>
                    <input type="text" id="address"
                           placeholder="Enter Address" required>
                </div>

                <button type="submit" id="submitBtn">
                    Add Record
                </button>

            </form>

        </section>


        <!-- Records Table -->
        <section class="panel" id="records">

            <div class="table-header">
                <h2>All Records</h2>

                <button type="button" id="refreshBtn">
                    Refresh
                </button>
            </div>

            <div class="table-container">

                <table>

                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                    </thead>

                    <tbody id="dataTable">

                    <tr>
                        <td colspan="5">Loading records...</td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

</div>

<script src="script.js"></script>

</body>
</html>
